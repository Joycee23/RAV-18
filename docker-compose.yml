services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
